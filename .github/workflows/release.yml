name: Build & Release

# Build a .dmg on every tag (v1.0.0, …) and attach it to the GitHub Release.
# You can also run it manually to get a downloadable build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner is required (swift build + codesign + hdiutil), and the cask
    # bump below uses BSD `sed -i ''`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Derive version from tag
        id: ver
        run: |
          # On a tag build use the tag (v0.1.3 -> 0.1.3); manual runs get 0.0.0
          # so the workflow still produces an artifact to inspect.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0"
          fi
          echo "marketing=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER (build ${GITHUB_RUN_NUMBER})"

      - name: Run tests
        run: swift test

      - name: Build the app
        env:
          DISKSPACER_VERSION: ${{ steps.ver.outputs.marketing }}
          DISKSPACER_BUILD: ${{ github.run_number }}
        run: ./scripts/make-app.sh --release

      - name: Verify version baked into the app
        run: |
          PLIST="build/Disk Spacer.app/Contents/Info.plist"
          GOT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "CFBundleShortVersionString = $GOT"
          [ "$GOT" = "${{ steps.ver.outputs.marketing }}" ] || {
            echo "::error::Info.plist version $GOT != expected ${{ steps.ver.outputs.marketing }}"; exit 1; }

      - name: Verify the icon made it into the bundle
        run: |
          test -f "build/Disk Spacer.app/Contents/Resources/AppIcon.icns" || {
            echo "::error::AppIcon.icns missing from the bundle"; exit 1; }

      - name: Code-sign
        # Two modes:
        #   • If SIGNING_CERTIFICATE_P12 / _PASSWORD secrets are set, sign with a
        #     stable self-signed identity. Its designated requirement is tied to
        #     the certificate (not the per-build cdhash), so macOS treats every
        #     update as the *same* app and the Full Disk Access grant survives
        #     updates — the user grants it once, ever.
        #   • Otherwise fall back to ad-hoc (--sign -). The app still runs after
        #     clearing quarantine, but its DR is the per-build cdhash, so Full
        #     Disk Access must be re-granted after each update.
        env:
          P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PWD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          APP="build/Disk Spacer.app"

          if [ -n "${P12:-}" ]; then
            echo "Signing with the self-signed certificate (stable identity)."
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KPWD="ci-$GITHUB_RUN_ID"
            security create-keychain -p "$KPWD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KPWD" "$KEYCHAIN"

            echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$P12_PWD" -T /usr/bin/codesign -T /usr/bin/security
            # Let codesign use the key without an interactive prompt.
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPWD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

            # Reference the identity by its SHA-1 hash. A self-signed cert is not
            # "policy-valid" (no trust chain), so `find-identity -v` would skip it;
            # without -v it's listed and signable by hash.
            IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-F]{40}' | head -1)"
            if [ -z "$IDENTITY" ]; then
              echo "::error::No code-signing identity found in the imported keychain (check the .p12 secret)."
              exit 1
            fi
            echo "Using identity: $IDENTITY"
            codesign --force --deep \
              --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"

            # The check that matters: the designated requirement must be tied to
            # the certificate, NOT a per-build cdhash. (--verify passes for ad-hoc
            # too, so it can't tell us this.)
            codesign -d -r- "$APP"
            if codesign -d -r- "$APP" 2>&1 | grep -q 'cdhash'; then
              echo "::error::Designated requirement is cdhash-based — identity not applied; Full Disk Access would still reset."
              exit 1
            fi
          else
            echo "No signing certificate secret set — falling back to ad-hoc signing."
            echo "::warning::Ad-hoc signed: users must re-grant Full Disk Access after each update. Add SIGNING_CERTIFICATE_P12/_PASSWORD secrets to fix."
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --strict --verbose=2 "$APP"

      - name: Package .dmg
        # The filename here must match the `url` in the Homebrew cask.
        run: |
          set -euo pipefail
          STAGE="dist/dmg"
          mkdir -p "$STAGE"
          cp -R "build/Disk Spacer.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Disk Spacer" -srcfolder "$STAGE" \
            -ov -format UDZO dist/DiskSpacer.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskSpacer-dmg
          path: dist/DiskSpacer.dmg

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiskSpacer.dmg
          generate_release_notes: true

      - name: Bump Homebrew cask
        # Points oleksii-stepanenko/homebrew-tap at this release so
        # `brew install --cask …/disk-spacer` gets the new version. Cross-repo
        # push needs a PAT (the default GITHUB_TOKEN is scoped to this repo
        # only); without the secret this step no-ops, like the signing step.
        #
        # NOTE: Casks/disk-spacer.rb must already exist in the tap — this step
        # only rewrites its version and sha256. Copy packaging/homebrew/disk-spacer.rb
        # into the tap once before the first tag.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::No TAP_GITHUB_TOKEN secret — skipping cask bump. Add a PAT with write access to homebrew-tap to automate it."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/DiskSpacer.dmg | awk '{print $1}')"
          echo "Bumping cask to ${VERSION} (sha256 ${SHA})"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/oleksii-stepanenko/homebrew-tap.git" tap
          CASK="tap/Casks/disk-spacer.rb"
          if [ ! -f "$CASK" ]; then
            echo "::error::$CASK not found in the tap. Copy packaging/homebrew/disk-spacer.rb into the tap first."
            exit 1
          fi
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK"

          cd tap
          if git diff --quiet; then
            echo "Cask already at ${VERSION} — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "disk-spacer ${VERSION}"
          git push -q
          echo "Cask bumped to ${VERSION}."
